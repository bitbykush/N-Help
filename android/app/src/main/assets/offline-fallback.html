<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N-HELP: Offline Mode</title>
  <style>
    body {
      background-color: #000000;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .badge {
      background: #F59E0B;
      color: #000;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    h1 { color: #EF4444; margin: 0 0 12px 0; font-size: 28px; }
    p { color: #94A3B8; max-width: 480px; font-size: 16px; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      background: #F59E0B;
      color: #000;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="badge">OFFLINE EMERGENCY ACCESS</div>
  <h1>N-HELP OFFLINE ACTIVE</h1>
  <p>Internet and cellular connections are unreachable. N-HELP core safety guides, emergency checklists, and mesh communication interfaces are cached on your device.</p>
  <a href="./" class="btn">Launch N-HELP Dashboard</a>
</body>
</html>
